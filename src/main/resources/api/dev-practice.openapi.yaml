          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftInput'
      x-required-roles:
      - AUTHOR
      - ADMIN
  /authoring/drafts/{draftId}:
    get:
      tags:
      - Authoring
      operationId: getDraft
      summary: Lire un brouillon et son ETag
      description: Même périmètre que listDrafts ; sinon 404.
      responses:
        '200':
          description: Lire un brouillon et son ETag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
          headers:
            ETag:
              description: Version forte du brouillon, par exemple "7". À recopier dans If-Match.
              schema:
                type: string
              example: '"7"'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-required-roles:
      - AUTHOR
      - REVIEWER
      - ADMIN
    put:
      tags:
      - Authoring
      operationId: replaceDraft
      summary: Remplacer le contenu du brouillon
      description: Auteur propriétaire ou ADMIN ; DRAFT uniquement, sinon 409. Remplacement atomique, incrémente
        revision. Les anciennes reviews restent dans l’historique mais ne valent jamais approbation de la nouvelle
        révision.
      responses:
        '200':
          description: Remplacer le contenu du brouillon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
          headers:
            ETag:
              description: Version forte du brouillon, par exemple "7". À recopier dans If-Match.
              schema:
                type: string
              example: '"7"'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftUpdate'
      x-required-roles:
      - AUTHOR
      - ADMIN
  /authoring/drafts/{draftId}/submit:
    post:
      tags:
      - Authoring
      operationId: submitDraftForReview
      summary: Soumettre le brouillon à relecture
      description: Auteur propriétaire ou ADMIN. DRAFT → IN_REVIEW. Vérifie cohérence complète des choix, corrigé,
        indices, références et thèmes. Incrémente revision. Aucune publication automatique.
      responses:
        '200':
          description: Soumettre le brouillon à relecture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
          headers:
            ETag:
              description: Version forte du brouillon, par exemple "7". À recopier dans If-Match.
              schema:
                type: string
              example: '"7"'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      x-required-roles:
      - AUTHOR
      - ADMIN
  /authoring/drafts/{draftId}/review:
    post:
      tags:
      - Authoring
      operationId: reviewDraft
      summary: Approuver ou demander des changements
      description: REVIEWER ou ADMIN, IN_REVIEW uniquement. APPROVE → APPROVED ; REQUEST_CHANGES → DRAFT. Incrémente
        revision et enregistre la décision. Pour un pilote individuel, autoapprobation autorisée uniquement à ADMIN
        et consignée dans reviews ; REVIEWER ne peut pas approuver son propre contenu (403).
      responses:
        '200':
          description: Approuver ou demander des changements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
          headers:
            ETag:
              description: Version forte du brouillon, par exemple "7". À recopier dans If-Match.
              schema:
                type: string
              example: '"7"'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      x-required-roles:
      - REVIEWER
      - ADMIN
  /authoring/drafts/{draftId}/publish:
    post:
      tags:
      - Authoring
      operationId: publishDraft
      summary: Publier la version approuvée
      description: 'Auteur propriétaire ou ADMIN. APPROVED requis. Vérifie que baseVersion est toujours la dernière
        version publiée, sinon 409. Publication atomique : nouvelle version immuable baseVersion+1, brouillon PUBLISHED
        et revision incrémentée. Corrigé et indices stockés avec cette version ; seules les projections apprenant
        sont retournées. Nouvelle modification : nouveau brouillon.'
      responses:
        '200':
          description: Publier la version approuvée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      x-required-roles:
      - AUTHOR
      - ADMIN
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton du fournisseur d’identité configuré. Acquisition hors périmètre.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Nombre maximal d’éléments.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 1000
      description: Curseur opaque retourné par la page précédente.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 100
        minLength: 1
      description: 'ETag fort exact obtenu sur le brouillon. Pas de joker. Absent : 428 ; obsolète : 412.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'UUID généré par le client, unique pour utilisateur + méthode + chemin. Conservation 24 h. Même
        clé et même corps : réponse originale sans répéter l’effet. Autre corps : 409. Déduplication atomique, y
        compris des appels IA. Opération encore en cours : 409 INVALID_STATE, réessayer avec la même clé.'
  responses:
    BadRequest:
      description: Requête syntaxiquement invalide.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Jeton absent, expiré ou invalide.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        WWW-Authenticate:
          description: Challenge Bearer.
          schema:
            type: string
          example: Bearer
    Forbidden:
      description: Rôle insuffisant ou déblocage pédagogique non acquis.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ressource inexistante ou non accessible dans le périmètre de l’appelant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Transition interdite, tentative déjà finalisée, version de base obsolète ou conflit d’idempotence.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: ETag du brouillon obsolète.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Données ou contraintes métier invalides ; violations détaille les champs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match requis.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Quota dépassé ; respecter Retry-After.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: Délai minimal en secondes avant nouvel essai, si disponible.
          schema:
            type: integer
            format: int32
            minimum: 0
    InternalError:
      description: Erreur serveur inattendue.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Assistance IA désactivée ou indisponible ; aucun échange partiel enregistré.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: Délai minimal en secondes avant nouvel essai, si disponible.
          schema:
            type: integer
            format: int32
            minimum: 0
  schemas:
    RegistrationInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 200
          description: Vérifié côté serveur ; jamais retourné ni journalisé en clair.
        displayName:
          type: string
          maxLength: 200
          minLength: 1
      required:
      - email
      - password
      - displayName
      description: Réponse toujours 202, y compris si l’adresse est déjà utilisée, pour ne pas révéler l’existence
        d’un compte.
    VerificationInput:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          maxLength: 200
          minLength: 1
      required:
      - token
    ResendVerificationInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
      required:
      - email
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - email
      - password
    Session:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          maxLength: 8000
        refreshToken:
          type: string
          maxLength: 500
        tokenType:
          type: string
          enum:
          - Bearer
        expiresInSeconds:
          type: integer
          format: int32
          minimum: 1
        user:
          $ref: '#/components/schemas/User'
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresInSeconds
      - user
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          maxLength: 500
          minLength: 1
      required:
      - refreshToken
    ExerciseType:
      type: string
      enum:
      - CODE_REVIEW
      - PREDICTION
      - DIAGNOSIS
      - REFACTORING
      - TECH_DISCOVERY
      - TECHNICAL_CHOICE
      - QUIZ
    Difficulty:
      type: string
      enum:
      - BEGINNER
      - INTERMEDIATE
      - ADVANCED
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
          example: urn:dev-practice:problem:invalid-state
        title:
          type: string
          maxLength: 200
          minLength: 1
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 4000
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
          - BAD_REQUEST
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - INVALID_STATE
          - IDEMPOTENCY_CONFLICT
          - STALE_VERSION
          - VALIDATION_FAILED
          - PRECONDITION_REQUIRED
          - RATE_LIMITED
          - AI_UNAVAILABLE
          - INTERNAL_ERROR
        traceId:
          type: string
          maxLength: 100
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
          maxItems: 100
      required:
      - type
      - title
      - status
      - code
      example:
        type: urn:dev-practice:problem:invalid-state
        title: Tentative déjà soumise
        status: 409
        code: INVALID_STATE
        detail: La réponse définitive ne peut plus être modifiée.
    Violation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          maxLength: 200
          minLength: 1
        message:
          type: string
          maxLength: 4000
      required:
      - field
      - message
    StackEntry:
      type: object
      additionalProperties: false
      properties:
        technology:
          type: string
          maxLength: 60
          minLength: 1
          example: Java
        currentVersion:
          type: string
          maxLength: 40
          minLength: 1
          example: '17'
        targetVersion:
          type: string
          maxLength: 40
          minLength: 1
          example: '21'
      required:
      - technology
      - currentVersion
    Preferences:
      type: object
      additionalProperties: false
      properties:
        stack:
          type: array
          items:
            $ref: '#/components/schemas/StackEntry'
          maxItems: 20
        topicIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
          uniqueItems: true
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        sessionMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 30
        locale:
          type: string
          enum:
          - fr
          - en
        timeZone:
          type: string
          maxLength: 100
          example: Europe/Paris
          description: Identifiant IANA validé par le serveur.
      required:
      - stack
      - topicIds
      - difficulty
      - sessionMinutes
      - locale
      - timeZone
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 200
          minLength: 1
        roles:
          type: array
          items:
            type: string
            enum:
            - LEARNER
            - AUTHOR
            - REVIEWER
            - ADMIN
          maxItems: 4
          uniqueItems: true
        preferences:
          $ref: '#/components/schemas/Preferences'
      required:
      - id
      - displayName
      - roles
      - preferences
    Topic:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          maxLength: 80
          pattern: ^[a-z0-9-]+$
        label:
          type: string
          maxLength: 200
          minLength: 1
      required:
      - id
      - slug
      - label
    TopicInput:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
          maxLength: 80
          pattern: ^[a-z0-9-]+$
        label:
          type: string
          maxLength: 200
          minLength: 1
      required:
      - slug
      - label
    Source:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
        url:
          type: string
          format: uri
          maxLength: 2048
        accessedAt:
          type: string
          format: date-time
      required:
      - title
      - url
      - accessedAt
    TechnologyRequirement:
      type: object
      additionalProperties: false
      properties:
        technology:
          type: string
          maxLength: 200
          minLength: 1
        minimumVersion:
          type: string
          maxLength: 40
          minLength: 1
        featureStatus:
          type: string
          enum:
          - STABLE
          - PREVIEW
          - INCUBATOR
        notes:
          type: string
          maxLength: 4000
      required:
      - technology
      - minimumVersion
      - featureStatus
    CodeFile:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          maxLength: 240
          minLength: 1
          description: Chemin relatif logique, jamais utilisé directement comme chemin disque.
        language:
          type: string
          maxLength: 40
          minLength: 1
          example: java
        content:
          type: string
          maxLength: 50000
        kind:
          type: string
          enum:
          - SOURCE
          - DIFF
          - LOG
          - TEST
      required:
      - path
      - language
      - content
      - kind
    Choice:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 50
          pattern: ^[a-zA-Z0-9_-]+$
        label:
          type: string
          maxLength: 2000
          minLength: 1
      required:
      - id
      - label
    ResponseSpec:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - FREE_TEXT
          - SINGLE_CHOICE
          - MULTIPLE_CHOICE
          - REVIEW
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
          maxItems: 10
      required:
      - kind
      description: SINGLE_CHOICE/MULTIPLE_CHOICE exigent 2 à 10 choix aux identifiants uniques. FREE_TEXT/REVIEW
        interdisent choices. QUIZ exige un format de choix. Les autres types peuvent utiliser tout format compatible
        avec leur énoncé. Validation serveur, erreur 422.
    ExerciseSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
          maxLength: 200
          minLength: 1
        type:
          $ref: '#/components/schemas/ExerciseType'
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        topicIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
          uniqueItems: true
        estimatedMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        technologies:
          type: array
          items:
            $ref: '#/components/schemas/TechnologyRequirement'
          maxItems: 10
        publishedAt:
          type: string
          format: date-time
      required:
      - id
      - version
      - title
      - type
      - difficulty
      - topicIds
      - estimatedMinutes
      - technologies
      - publishedAt
    Exercise:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
          maxLength: 200
          minLength: 1
        type:
          $ref: '#/components/schemas/ExerciseType'
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        topicIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
          uniqueItems: true
        estimatedMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        technologies:
          type: array
          items:
            $ref: '#/components/schemas/TechnologyRequirement'
          maxItems: 10
        publishedAt:
          type: string
          format: date-time
        promptMarkdown:
          type: string
          maxLength: 20000
          minLength: 1
        learningObjectives:
          type: array
          items:
            type: string
            maxLength: 200
            minLength: 1
          maxItems: 10
          minItems: 1
        files:
          type: array
          items:
            $ref: '#/components/schemas/CodeFile'
          maxItems: 10
        responseSpec:
          $ref: '#/components/schemas/ResponseSpec'
        hintCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
      required:
      - id
      - version
      - title
      - type
      - difficulty
      - topicIds
      - estimatedMinutes
      - technologies
      - publishedAt
      - promptMarkdown
      - learningObjectives
      - files
      - responseSpec
      - hintCount
      description: Projection apprenant. Ne contient ni corrigé, ni bonne réponse, ni contenu des indices non débloqués.
        Une version publiée est immuable.
    RubricCriterion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 50
          minLength: 1
        label:
          type: string
          maxLength: 200
          minLength: 1
        importance:
          type: string
          enum:
          - BLOCKING
          - MAJOR
          - MINOR
        explanationMarkdown:
          type: string
          maxLength: 20000
          minLength: 1
      required:
      - id
      - label
      - importance
      - explanationMarkdown
    Correction:
      type: object
      additionalProperties: false
      properties:
        explanationMarkdown:
          type: string
          maxLength: 20000
          minLength: 1
        acceptedAnswers:
          type: array
          items:
            type: string
            maxLength: 4000
            minLength: 1
          maxItems: 20
        correctChoiceIds:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 10
          uniqueItems: true
        expectedVerdicts:
          type: array
          items:
            type: string
            enum:
            - APPROVE
            - REQUEST_CHANGES
