openapi: 3.0.3
info:
  title: La Forge API
  version: 0.1.0
  description: |
    Contrat du prototype de laboratoire d’entraînement technique. Texte métier en français, identifiants API en anglais.

    Périmètre : profil, catalogue, exercices versionnés, tentatives, indices, corrigés, révisions, veille, défis collectifs, édition et tuteur IA optionnel. Pas d’exécution distante de code, génération automatique de contenus, classement RH ou gestion multi-entreprises. Une installation correspond à une entreprise ou un groupe pilote. Les rôles sont gérés hors API.

    Authentification : compte créé localement via /auth/registrations (email + mot de passe), activé par confirmation
    du jeton de vérification reçu par courriel (/auth/verifications). Connexion via /auth/sessions : le serveur émet
    lui-même un bearer JWT de courte durée (signature RS256) accompagné d’un jeton de renouvellement opaque
    (/auth/sessions/refresh). Le serveur valide signature, issuer, audience et expiration ; utilisateur courant déduit
    de sub, jamais du corps de requête. Rôles LEARNER, AUTHOR, REVIEWER, ADMIN cumulatifs ; tous les comptes peuvent
    pratiquer dès activation. x-required-roles signifie au moins un rôle de la liste, plus les contraintes de propriété
    décrites. ADMIN n’accorde pas l’accès aux tentatives privées des autres.

    Isolation : 404 pour une ressource hors périmètre, 403 pour un rôle insuffisant ou une condition de déblocage non remplie dans une ressource accessible. Les projections catalogue n’exposent jamais de corrigé. Les accès éditoriaux constituent une exception volontaire pour les auteurs/relecteurs ; le produit n’est pas un dispositif anti-triche ou de certification.

    Versions : une publication est immuable et reste lisible. Tentatives et défis référencent explicitement exercice + version. Tous les timestamps sont RFC 3339 avec offset ; le serveur utilise UTC et son horloge pour les échéances. À now >= closesAt le défi est fermé, sans tâche planifiée nécessaire.

    Révisions : algorithme fixe documenté dans les opérations, pas de promesse d’adaptation scientifique. Les compteurs et files de révision sont mis à jour atomiquement à la soumission. Les réponses libres sont discutées et autoévaluées, jamais notées automatiquement par un LLM.

    HTTP : JSON UTF-8, erreurs application/problem+json, propriétés d’entrée inconnues rejetées. PUT remplace complètement la ressource concernée. Pagination stable par clés documentées et curseur opaque ; insertions concurrentes peuvent apparaître à la prochaine navigation. Lecture sans effet de bord. Les répétitions idempotentes ne créent ni tentative, commentaire ni échéance supplémentaires.

    Concurrence : If-Match fort obligatoire pour mutations éditoriales du brouillon ; validation et transition atomiques. Sur les POST avec Idempotency-Key, même clé/corps pendant 24 h rejoue la réponse originale. Les autres mutations documentent leurs règles de répétition et de conflit. Le frontend doit conserver la clé jusqu’à obtention du résultat.

    Sécurité de rendu : Markdown et code sont des contenus non fiables ; assainir le HTML au rendu, ne jamais exécuter le code fourni. Les URL de sources sont des liens, aucune récupération arbitraire serveur implicite. Les réponses privées utilisent Cache-Control: private, no-store. Les liens collectifs exigent toujours authentification et inscription. L’IA ne reçoit que les données autorisées et ses réponses n’écrasent jamais un corrigé validé.

    Parcours minimal : GET /me/dashboard → GET /exercises/{id}/versions/{version} → POST /attempts → PUT /attempts/{id}/submission → GET /attempts/{id}/debrief → PUT /attempts/{id}/self-assessment. Parcours collectif : créer → rejoindre avec code → tenter → soumettre → comparer → discuter. Parcours éditorial : DRAFT → IN_REVIEW → APPROVED → PUBLISHED, retour DRAFT si changements demandés.
servers:
- url: /api/v1
  description: Même origine que le frontend ; préfixe de la v1.
security:
- bearerAuth: []
tags:
- name: Auth
  description: Création de compte, confirmation par courriel et sessions JWT
- name: Profile
  description: Profil et suivi privé
- name: Catalog
  description: Catalogue publié sans corrigés
- name: Practice
  description: Tentatives et répétition
- name: Tutor
  description: Assistance IA après soumission, optionnelle
- name: Discoveries
  description: Fiches de veille sourcées
- name: Collective
  description: Défis partagés et débrief collectif
- name: Authoring
  description: Contenus et validation éditoriale
paths:
  /auth/registrations:
    post:
      tags:
      - Auth
      operationId: registerAccount
      summary: Créer un compte
      description: Crée un compte en attente d’activation et envoie un courriel de confirmation contenant un jeton
        à usage unique valable 24 h. Réponse 202 constante que l’adresse existe déjà ou non, afin de ne jamais
        révéler l’existence d’un compte. Aucune authentification requise.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '202':
          description: Demande d’inscription acceptée ; courriel envoyé si l’adresse est éligible.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/verifications:
    post:
      tags:
      - Auth
      operationId: verifyAccount
      summary: Confirmer le compte
      description: Valide le jeton reçu par courriel, active le compte et attribue le rôle LEARNER. Jeton à usage
        unique, expiré après 24 h ou après utilisation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationInput'
      responses:
        '200':
          description: Compte activé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/verifications/resend:
    post:
      tags:
      - Auth
      operationId: resendVerification
      summary: Renvoyer le courriel de confirmation
      description: Renvoie un nouveau jeton de vérification si le compte existe et n’est pas déjà actif. Réponse
        202 constante, limitée en débit par adresse.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationInput'
      responses:
        '202':
          description: Demande acceptée ; courriel renvoyé si éligible.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sessions:
    post:
      tags:
      - Auth
      operationId: createSession
      summary: Se connecter
      description: Authentifie par email et mot de passe un compte activé, émet un jeton d’accès JWT de courte durée
        et un jeton de renouvellement opaque.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Session créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Auth
      operationId: revokeSession
      summary: Se déconnecter
      description: Révoque le jeton de renouvellement fourni. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Session révoquée.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sessions/refresh:
    post:
      tags:
      - Auth
      operationId: refreshSession
      summary: Renouveler la session
      description: Échange un jeton de renouvellement valide contre un nouveau jeton d’accès et un nouveau jeton
        de renouvellement (rotation). La réutilisation d’un jeton déjà consommé révoque toute la famille de jetons.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session renouvelée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      tags:
      - Profile
      operationId: getMe
      summary: Lire le profil courant
      description: Lire le profil courant
      responses:
        '200':
          description: Lire le profil courant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/preferences:
    put:
      tags:
      - Profile
      operationId: replaceMyPreferences
      summary: Remplacer les préférences
      description: Remplacement complet des préférences. Les topicIds doivent exister. Aucun changement des rôles
        ou de l’identité.
      responses:
        '200':
          description: Remplacer les préférences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
  /me/dashboard:
    get:
      tags:
      - Profile
      operationId: getMyDashboard
      summary: Obtenir les suggestions personnelles
      description: Obtenir les suggestions personnelles
      responses:
        '200':
          description: Obtenir les suggestions personnelles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/progress:
    get:
      tags:
      - Profile
      operationId: getMyProgress
      summary: Lire la progression privée
      description: Lire la progression privée
      responses:
        '200':
          description: Lire la progression privée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /topics:
    get:
      tags:
      - Catalog
      operationId: listTopics
      summary: Lister les thèmes
      description: Référentiel initial chargé avec le contenu du pilote. Ordre label puis id ; ajout via
        POST /topics.
      responses:
        '200':
          description: Lister les thèmes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      tags:
      - Catalog
      operationId: createTopic
      summary: Ajouter un thème
      description: Réservé aux rôles AUTHOR et ADMIN. L’identifiant est généré par le serveur. Un slug déjà
        utilisé produit un conflit.
      responses:
        '201':
          description: Thème créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicInput'
      x-required-roles:
      - AUTHOR
      - ADMIN
  /exercises:
    get:
      tags:
      - Catalog
      operationId: listExercises
      summary: Lister les exercices publiés
      description: Dernière version publiée de chaque exercice. Filtres combinés par ET ; q cherche dans titre et
        énoncé, jamais dans le corrigé. Ordre publishedAt décroissant puis id.
      responses:
        '200':
          description: Lister les exercices publiés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExercisePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/ExerciseType'
        description: ''
      - name: difficulty
        in: query
        schema:
          $ref: '#/components/schemas/Difficulty'
        description: ''
      - name: topicId
        in: query
        schema:
          type: string
          format: uuid
        description: ''
      - name: technology
        in: query
        schema:
          type: string
          maxLength: 60
        description: ''
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
        description: ''
  /exercises/{exerciseId}:
    get:
      tags:
      - Catalog
      operationId: getLatestExercise
      summary: Lire la dernière version publiée
      description: Sans indices ni correction. L’identifiant de version doit être conservé lors de la création d’une
        tentative.
      responses:
        '200':
          description: Lire la dernière version publiée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /exercises/{exerciseId}/versions/{version}:
    get:
      tags:
      - Catalog
      operationId: getExerciseVersion
      summary: Lire une version publiée précise
      description: Les anciennes versions restent accessibles aux utilisateurs authentifiés. Une publication ultérieure
        ne change jamais cet énoncé.
      responses:
        '200':
          description: Lire une version publiée précise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
  /attempts:
    post:
      tags:
      - Practice
      operationId: createAttempt
      summary: Commencer une tentative
      description: 'Utilisateur courant uniquement. En cas de tentative IN_PROGRESS existante hors défi : 409. Pour
        un défi, exige inscription, état OPEN, absence de tentative précédente et correspondance exercice/version
        ; toute pratique antérieure soumise ou indice déjà révélé sur cette version hors de ce défi interdit la
        tentative de défi (409). Pour reviewItemId, exige révision due et aucune tentative liée en cours ; soumettre
        clôture cette révision. Le statut initial est IN_PROGRESS.'
      responses:
        '201':
          description: Commencer une tentative.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttempt'
  /me/attempts:
    get:
      tags:
      - Practice
      operationId: listMyAttempts
      summary: Lister mes tentatives
      description: Ordre startedAt décroissant puis id. Ne retourne que les tentatives de l’appelant.
      responses:
        '200':
          description: Lister mes tentatives.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - IN_PROGRESS
          - SUBMITTED
          - ABANDONED
        description: ''
  /attempts/{attemptId}:
    get:
      tags:
      - Practice
      operationId: getAttempt
      summary: Lire ma tentative
      description: Accès propriétaire uniquement, sinon 404.
      responses:
        '200':
          description: Lire ma tentative.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /attempts/{attemptId}/submission:
    put:
      tags:
      - Practice
      operationId: submitAttempt
      summary: Soumettre la réponse définitive
      description: 'Transition atomique IN_PROGRESS → SUBMITTED. Valide le format et les références ; réponse ensuite
        immuable. Même réponse canonique déjà soumise : 200 sans répéter les effets ; réponse différente : 409.
        Défi fermé et tentative non soumise : 409. Débloque le débrief ; déclenche une révision si choix incorrect
        ou confiance ≤ 2. Clôture la révision source le cas échéant. Aucune dépendance à l’IA.'
      responses:
        '200':
          description: Soumettre la réponse définitive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswer'
  /attempts/{attemptId}/abandon:
    post:
      tags:
      - Practice
      operationId: abandonAttempt
      summary: Abandonner une tentative individuelle
      description: 'IN_PROGRESS → ABANDONED, appel répété : 200. Tentative soumise ou liée à un défi : 409. Une
        révision source reste due. Propriétaire uniquement.'
      responses:
        '200':
          description: Abandonner une tentative individuelle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /attempts/{attemptId}/hints:
    post:
      tags:
      - Practice
      operationId: revealHint
      summary: Débloquer un indice
      description: 'Propriétaire, tentative IN_PROGRESS. Les indices se débloquent dans l’ordre à partir de 1. Un
